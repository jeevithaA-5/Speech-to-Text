<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech to Text</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎤 Speech to Text</h1>
        <p class="subtitle">Speak and convert your voice into text</p>

        <textarea id="text" placeholder="Your speech will appear here..."></textarea>

        <div class="buttons">
            <button id="startBtn">🎤 Start Speaking</button>
            <button id="stopBtn">⏹ Stop</button>
            <button id="clearBtn">🗑 Clear</button>
        </div>

        <button id="copyBtn" class="copy-btn">📋 Copy Text</button>

        <p id="status">Click "Start Speaking" to begin</p>

    </div>

    <script src="script.js"></script>
</body>
</html>
